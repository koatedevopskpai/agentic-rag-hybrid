[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-hybrid"
version = "0.1.0"
description = "Planner-executor RAG with hybrid retrieval (BM25 sparse + deterministic dense), reciprocal-rank fusion, and groundedness-filtered results. Deterministic-first, no LLM in the retrieval path."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"